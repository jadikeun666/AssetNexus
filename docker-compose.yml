services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: assetnexus
      POSTGRES_USER: assetnexus
      POSTGRES_PASSWORD: assetnexus_dev_password
    ports:
      - "5433:5432"
    volumes:
      - assetnexus_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: "server -dir=/data -s3 -s3.port=8333 -master.port=9333 -volume.port=8080"
    ports:
      - "9333:9333"   # master UI/API
      - "8080:8080"   # volume server
      - "8333:8333"   # S3-compatible gateway (database.md §3: `weed s3`)
    volumes:
      - assetnexus_seaweedfs:/data

volumes:
  assetnexus_pgdata:
  assetnexus_seaweedfs:
