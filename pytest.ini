[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = tests.py test_*.py *_tests.py

# Filter warning SANGAT SPESIFIK (pesan persis, bukan kategori luas) untuk
# 3 warning yang murni berasal dari kode INTERNAL library pihak ketiga
# (django-ninja, jaxopt), BUKAN dari kode project ini -- dikonfirmasi via
# issue upstream yang masih terbuka, belum ada rilis yang menyelesaikannya
# untuk versi yang kita pin (requirements.txt). Sengaja TIDAK memakai
# filter luas ("ignore::DeprecationWarning" tanpa syarat) supaya warning
# lain yang mungkin relevan di masa depan tetap terlihat.
filterwarnings =
    ignore:Converter 'uuid' is already registered.*:django.utils.deprecation.RemovedInDjango60Warning
    # django-ninja meregistrasi ulang UUID path converter yang sudah native
    # di Django -- perilaku internal django-ninja, bukan kode kita.

    ignore:Support for class-based `config` is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20
    # django-ninja masih pakai gaya `class Config` Pydantic v1 di beberapa
    # tempat internal -- lihat github.com/vitalik/django-ninja/issues/1489
    # dan /issues/1245 (masih terbuka per pengecekan terakhir).

    ignore:JAXopt is no longer maintained.*:DeprecationWarning
    # Diketahui & diterima sejak awal Fase 1 -- jaxopt tetap fungsional
    # dengan versi jax yang kita pakai (diverifikasi smoke test), belum
    # ada pengganti dalam stack fixed (architecture.md §1) yang menyediakan
    # L-BFGS setara tanpa amandemen dokumen.
